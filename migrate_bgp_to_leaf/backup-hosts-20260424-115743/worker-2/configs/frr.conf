frr defaults traditional
hostname worker-2
log syslog informational
service integrated-vtysh-config
!
ip prefix-list VIP-SUPERNET seq 10 permit 192.168.0.0/16 le 32
!
route-map VIP-FILTER permit 10
 match ip address prefix-list VIP-SUPERNET
!
bfd
 profile FAST-BGP
  transmit-interval 200
  receive-interval 200
  detect-multiplier 3
 exit
exit
!
router bgp 65203
 bgp router-id 10.1.3.10
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 30 90
 neighbor 10.1.3.1 remote-as 65000
 neighbor 10.1.3.1 description leaf-svi
 neighbor 10.1.3.1 bfd
 neighbor 10.1.3.1 bfd profile FAST-BGP
 !
 address-family ipv4 unicast
  redistribute connected route-map VIP-FILTER
  neighbor 10.1.3.1 activate
  neighbor 10.1.3.1 route-map VIP-FILTER in
  neighbor 10.1.3.1 route-map VIP-FILTER out
 exit-address-family
exit
!
end
