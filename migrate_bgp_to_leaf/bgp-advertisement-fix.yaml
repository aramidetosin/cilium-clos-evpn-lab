---
# Explicit match-all selector. The pool already gates namespaces, so every
# LB VIP in the cluster is in an allowed namespace and should be advertised.
# `selector: {}` deserializes to a non-nil LabelSelector with empty
# matchLabels + matchExpressions, which evaluates to labels.Everything().
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: lb-vip-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
  - advertisementType: Service
    service:
      addresses:
      - LoadBalancerIP
    selector: {}
