  name: bgp-worker-1
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: worker-1
  bgpInstances:
  - name: instance-worker-1
    localASN: 65202
    localPort: 179
    peers:
    - name: peer-master
      peerASN: 65201
      peerAddress: 10.1.1.10
      peerConfigRef:
        name: cluster-peer
    - name: peer-worker-2
      peerASN: 65203
      peerAddress: 10.1.3.10
      peerConfigRef:
        name: cluster-peer
    - name: peer-worker-3
      peerASN: 65204
      peerAddress: 10.1.4.10
      peerConfigRef:
        name: cluster-peer
