# /etc/netplan/60-fabric.yaml on master
# ens4 = e1 = fabric to its leaf. Does NOT touch ens3 (cloud-init owns that).
network:
  version: 2
  ethernets:
    ens4:
      dhcp4: false
      addresses:
        - 10.1.1.10/24
      mtu: 9000
      routes:
        - to: 10.0.0.0/8
          via: 10.1.1.1
