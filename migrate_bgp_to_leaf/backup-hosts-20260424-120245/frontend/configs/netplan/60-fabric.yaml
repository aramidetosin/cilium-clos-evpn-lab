# Fabric edge link to Leaf-1 Eth1/4 (VRF tenant-1)
# Uses an IP inside 192.168.0.0/16 so pod replies traverse the existing
# BGP-installed supernet route on each K8s host — no host-side changes needed.
network:
  version: 2
  ethernets:
    ens4:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses:
        - 192.168.255.2/30
      routes:
        - to: 192.168.0.0/16
          via: 192.168.255.1
          metric: 100
