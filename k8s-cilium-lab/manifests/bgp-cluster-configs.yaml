# 4 CiliumBGPClusterConfig objects, one per node.
# Each node selects itself by kubernetes.io/hostname and peers with the other 3.
# Full-mesh eBGP, 6 sessions total.
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-master
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: master
  bgpInstances:
  - name: instance-master
    localASN: 65201
    localPort: 179
    peers:
    - name: peer-worker-1
      peerASN: 65202
      peerAddress: 10.1.2.10
      peerConfigRef:
        name: cluster-peer
    - name: peer-worker-2
      peerASN: 65203
      peerAddress: 10.1.3.10
      peerConfigRef:
        name: cluster-peer
    - name: peer-worker-3
      peerASN: 65204
      peerAddress: 10.1.4.10
      peerConfigRef:
        name: cluster-peer
---
